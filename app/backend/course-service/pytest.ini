# -- FILE: pytest.ini (or tox.ini)
[pytest]
DJANGO_SETTINGS_MODULE = src.course_service.settings
# -- recommended but optional:
python_files = tests.py test_*.py *_tests.py
addopts = --nomigrations --reuse-db -v -m "not slow"
pythonpath = .
markers =
    django_db: mark test to use database
    slow: mark test as slow
    integration: mark test as integration test
    permissions: mark test as permissions test
    archive: mark test as archive functionality test
events {}

http {
    # define servers
    upstream backend {
        server backend:8000;
    }

    # define user profile service
    upstream user-profile-service {
        server user-profile-service:8001;
    }
   
    # define auth service
    upstream auth-service {
        server auth-service:8002;
    }

     # define application job posting service
    upstream application-service {
        server application-service:8003;
    }

    
    # define frontend server
    upstream frontend {
        server frontend:5173;
    }

    server {
        # listen at port 80 for both IPv4 and IPv6
        listen 80;
        listen [::]:80;

        # Admin interface - route to main backend
        location /admin/ {
            proxy_pass http://backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy static files to Django services (they handle their own static files)
        location /static/ {
            proxy_pass http://backend/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend routes -> Vite dev server (React SPA)
        location / {
            proxy_pass http://frontend;
            # try_files $uri /index.html; --> fallback to index.html for SPA routing
            #note: the headers below preserve the original client info when nginx forwards our requests to other services
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth service routes
        location /api/auth/ {
            proxy_pass http://auth-service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #user profile service routes
        location /api/profile/ {
            proxy_pass http://user-profile-service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #routes for application-job posting service
        location /api/ajp/ {            
            proxy_pass http://application-service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
       
        #process route for the backend api calls
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        


    }
}
events {}

http {
    # define backend server
    upstream backend {
        server backend:8000;
    }

    # define frontend server
    upstream frontend {
        server frontend:5173;
    }

    server {
        # listen at port 80 for both IPv4 and IPv6
        listen 80;
        listen [::]:80;

        # Frontend routes -> Vite dev server (React SPA)
        location / {
            proxy_pass http://frontend;
            # try_files $uri /index.html; --> fallback to index.html for SPA routing
        }

        # process route for the api calls
        location /api/ {
            proxy_pass http://backend;
        }
    }
}
services:
  backend:
    build:
      context: ./backend/simpleapi
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./backend/simpleapi:/app
    #do not start the backend service until the database is healthy
    depends_on:
      db:
        condition: service_healthy
        restart: true
      user-profile-service:
        condition: service_healthy
        restart: true
      application-service:
        condition: service_healthy
        restart: true
    networks:
      - app-networks

  user-profile-service:
    build:
      context: ./backend/user-profile-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./backend/user-profile-service:/app
      - ./shared-utils:/app/shared-utils
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - app-networks
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./backend/auth-service:/app
      - ./shared-utils:/app/shared-utils
    depends_on:
      db:
        condition: service_healthy
        restart: true
      user-profile-service:
        condition: service_healthy
        restart: true

    # set app-networks as the current network
    networks:
      - app-networks

  application-service:
    container_name: applications-jobpostings-service
    build:
      context: ./backend/applications-jobpostings-service
    ports:
      - "8003:8003"
    env_file:
      - .env
    volumes:
      - ./backend/applications-jobpostings-service:/app
      - ./shared-utils:/app/shared-utils
      - ./documents:/app/documents # for documents
    depends_on:
      db:
        condition: service_healthy
        restart: true
      user-profile-service:
        condition: service_healthy
        restart: true
      courses-terms-service:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # set app-networks as the current network
    networks:
      - app-networks

  courses-terms-service:
    container_name: "courses-terms-service"
    build:
      context: ./backend/course-service
    ports:
      - "8004:8004"
    env_file:
      - .env
    volumes:
      - ./backend/course-service:/app
      - ./shared-utils:/app/shared-utils
    depends_on:
      db:
        condition: service_healthy
        restart: true
      user-profile-service:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/api/course-term-service/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # set app-networks as the current network
    networks:
      - app-networks

  allocations-service:
    container_name: allocations-service
    build:
      context: ./backend/allocations-service
    ports:
      - "8005:8005"
    env_file:
      - .env
    volumes:
      - ./backend/allocations-service:/app
      - ./shared-utils:/app/shared-utils
    depends_on:
      db:
        condition: service_healthy
        restart: true
      user-profile-service:
        condition: service_healthy
        restart: true
      application-service:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/api/allocations/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-networks

  allocations-worker:
    build: ./backend/allocations-service
    command: celery -A allocations_service worker -Q allocations -l info
    env_file:
      - .env
    volumes:
      - ./backend/allocations-service/src:/app/src
      - ./shared-utils:/app/shared-utils
    depends_on:
      - redis
      - allocations-service
    networks:
      - app-networks

  allocations-beat:
    build: ./backend/allocations-service
    command: celery -A allocations_service beat -l info
    env_file:
      - .env
    volumes:
      - ./backend/allocations-service/src:/app/src
      - ./shared-utils:/app/shared-utils
    depends_on:
      - redis
      - allocations-service
    networks:
      - app-networks

  notification-service:
    container_name: notification-service
    build:
      context: ./backend/notification-service
    ports:
      - "8006:8006"
    env_file:
      - .env
    volumes:
      - ./backend/notification-service:/app
      - ./shared-utils:/app/shared-utils
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8006/api/notifications/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-networks

  celery-worker:
    build:
      context: ./backend/notification-service
    command: celery -A notification_service worker -Q notifications --loglevel=info
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - .env
    volumes:
      - ./backend/notification-service:/app
      - ./shared-utils:/app/shared-utils
    depends_on:
      - redis
      - notification-service
    networks:
      - app-networks

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-networks

  frontend:
    build:
      context: ./frontend/ta-management
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    # set app-networks as the current network
    networks:
      - app-networks

  # postgres database service
  # This service uses the official postgres image and sets up a database with the specified user and password.
  # The credentials are stored in the env file
  db:
    container_name: app_database
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Healthcheck to ensure the database is ready before other services depend on it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    # set app-networks as the current network
    networks:
      - app-networks

  #pdgadmin service for managing the database, optional use
  # This service uses the official pgAdmin image and sets up a web interface for managing the PostgreSQL database.
  # To access pgAdmin, navigate to http://localhost:5050 in your web browser.
  # You can log in with the credentials specified below.
  pgadmin:
    container_name: app_pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: capstone@domain.com
      PGADMIN_DEFAULT_PASSWORD: capstone
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # set app-networks as the current network
    networks:
      - app-networks

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    # set app-networks as the current network
    networks:
      - app-networks
    # do not start the reverse proxy until all other services have been activated
    depends_on:
      - frontend
      - backend
      - user-profile-service
      - auth-service
      - application-service
      - courses-terms-service
      - allocations-service
    volumes:
      - ./documents:/app/documents:ro # read-only access as nginx will serve documents.

volumes:
  db_data:
  pgadmin_data:

# define a network that will serve as a bridge between containers
networks:
  app-networks:
    driver: bridge

version: '3.9'

services:
  backend:
    build:
      context: ./backend/simpleapi
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
  
  frontend:
    build:
      context: ./frontend/ta-management
    ports:
      - "5173:5173"
    command: npm run dev -- --host

  db:
    container_name: app_database
    image: postgres:latest 
    restart: unless-stopped
    environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}      
    volumes:           
        - db_data:/var/lib/postgresql/data
    ports:
        - "5432:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 10s
        retries: 5
        start_period: 30s
        timeout: 10s

  pgadmin:
      container_name: app_pgadmin
      image: dpage/pgadmin4:latest
      restart: unless-stopped
      environment:
        PGADMIN_DEFAULT_EMAIL: capstone@domain.com
        PGADMIN_DEFAULT_PASSWORD: capstone     
      ports:
        - "5050:80"
      depends_on:
        - db
      volumes:
        - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data:  
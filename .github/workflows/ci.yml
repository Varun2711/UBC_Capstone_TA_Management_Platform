name: CI

on:
  pull_request:
    branches:
      - development

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v4
              with:
                node-version: '22.x'
            - name: Install dependencies
              run: npm install
              working-directory: ./app/frontend/ta-management
            - name: Test frontend
              run: npm test
              working-directory: ./app/frontend/ta-management